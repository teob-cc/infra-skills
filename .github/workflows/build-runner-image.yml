name: Build Custom GitHub Actions Runner Image

# Three ways to run it:
#  - workflow_call from a thin caller in YOUR envs repo (the normal path: the job
#    then runs on your org's self-hosted runners and reads your Harbor secrets):
#      jobs:
#        build:
#          uses: teob-cc/infra-skills/.github/workflows/build-runner-image.yml@main
#          with: { environment: prod, base_domain: prod.example.com }
#          secrets: inherit
#  - workflow_dispatch here (only useful in a fork that has its own runners);
#  - push here; those runs have no inputs, so set the repository (or organization)
#    variables RUNNER_ENVIRONMENT and BASE_DOMAIN so they know where to run and push.
on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (e.g. prod); also the runner label"
        required: true
        type: string
      base_domain:
        description: "Base domain of the environment, e.g. prod.example.com -- registry is harbor.<base_domain>"
        required: true
        type: string
      harbor_registry:
        description: "Harbor registry hostname (defaults to harbor.<base_domain>)"
        required: false
        type: string
        default: ""
      publish_latest:
        description: Update the shared latest tag after validation
        required: false
        type: boolean
        default: true
      skills_ref:
        description: "infra-skills git ref to build the image from"
        required: false
        type: string
        default: "main"
    outputs:
      digest:
        description: Validated runner image digest
        value: ${{ jobs.build-and-push.outputs.digest }}
      source_sha:
        description: infra-skills source commit
        value: ${{ jobs.build-and-push.outputs.source_sha }}
    secrets:
      HARBOR_USERNAME:
        required: true
      HARBOR_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (e.g. prod)"
        required: true
        type: string
      base_domain:
        description: "Base domain of the environment, e.g. prod.example.com — registry is harbor.<base_domain>"
        required: true
        type: string
      harbor_registry:
        description: "Harbor registry hostname (defaults to harbor.<base_domain>)"
        required: false
        type: string
        default: ""
      publish_latest:
        description: Update the shared latest tag after validation
        required: false
        type: boolean
        default: true
      skills_ref:
        description: "infra-skills git ref to build the image from"
        required: false
        type: string
        default: "main"
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-runner-image.yml'
      - 'images/github-runner/**'

env:
  DOCKERFILE: images/github-runner/Dockerfile
  CONTEXT: images/github-runner
  IMAGE_NAME: github-runner
  HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
  HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
  HARBOR_PROJECT: library

jobs:
  build-and-push:
    outputs:
      image: ${{ steps.meta.outputs.image }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      digest: ${{ steps.build.outputs.digest }}
    runs-on:
      - self-hosted
      - ${{ inputs.environment || vars.RUNNER_ENVIRONMENT }}

    environment:
      name: ${{ inputs.environment || vars.RUNNER_ENVIRONMENT }}

    # The image goes to Harbor with HARBOR_* secrets; no GitHub package or OIDC token is
    # needed. Requesting only what is used keeps callers free of a permissions block.
    permissions:
      contents: read

    steps:
      # Always check out infra-skills itself: when called from another repo the
      # default checkout would be the caller, which has no runner Dockerfile.
      - name: Checkout infra-skills
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: teob-cc/infra-skills
          ref: ${{ inputs.skills_ref || 'main' }}

      - name: Set Harbor registry URL
        id: harbor
        run: |
          # Explicit harbor_registry input wins; otherwise derive harbor.<base_domain>
          # (base_domain input on dispatch, BASE_DOMAIN variable on push).
          HARBOR_REGISTRY="${{ inputs.harbor_registry || format('harbor.{0}', inputs.base_domain || vars.BASE_DOMAIN) }}"
          if [ "$HARBOR_REGISTRY" = "harbor." ]; then
            echo "No base_domain input and no BASE_DOMAIN repository variable set" >&2
            exit 1
          fi
          echo "registry=${HARBOR_REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "Using Harbor registry: ${HARBOR_REGISTRY}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Harbor
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ steps.harbor.outputs.registry }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Compute tags
        id: meta
        env:
          PUBLISH_LATEST: ${{ inputs.publish_latest != false }}
        run: |
          set -euo pipefail
          IMAGE_REGISTRY="${{ steps.harbor.outputs.registry }}"
          IMAGE_REPO="${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}"
          SOURCE_SHA=$(git rev-parse HEAD)
          SHA_TAG=${SOURCE_SHA::12}
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          DATE_TAG=$(date -u +%Y%m%d)

          TAGS="${IMAGE_REGISTRY}/${IMAGE_REPO}:${SHA_TAG}"
          if [ "$PUBLISH_LATEST" = true ]; then
            TAGS="${TAGS},${IMAGE_REGISTRY}/${IMAGE_REPO}:${DATE_TAG},${IMAGE_REGISTRY}/${IMAGE_REPO}:latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_REGISTRY}/${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u --iso-8601=seconds)" >> "$GITHUB_OUTPUT"

      - name: Build and verify candidate
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load -t runner-candidate:${GITHUB_RUN_ID} "$CONTEXT"
          docker run --rm --network none --entrypoint bash runner-candidate:${GITHUB_RUN_ID} -ec '
            test "$(/runnertmp/bin/Runner.Listener --version)" = 2.338.0
            test "$(rustc --version | cut -d" " -f2)" = 1.99.0
            cargo audit --version
            protoc --version
            docker buildx version
            helm version --short
            yq --version
            printf "fn main() {}\n" > /tmp/smoke.rs
            rustc /tmp/smoke.rs -o /tmp/smoke
            /tmp/smoke
          '

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.source_sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move updated build cache
        if: success()
        run: |
          # Remove old cache contents (not the directory itself, which may be a mount point)
          rm -rf /tmp/.buildx-cache/* || true
          # Move new cache contents
          if [ -d /tmp/.buildx-cache-new ]; then
            mv /tmp/.buildx-cache-new/* /tmp/.buildx-cache/ 2>/dev/null || true
            rmdir /tmp/.buildx-cache-new || true
          fi

      - name: Show pushed tags
        run: |
          echo "Pushed to: ${{ steps.meta.outputs.image }}"
          echo "Tags:"
          IFS=',' read -ra T <<< "${{ steps.meta.outputs.tags }}"
          for t in "${T[@]}"; do echo " - $t"; done
