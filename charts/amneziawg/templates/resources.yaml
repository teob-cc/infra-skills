apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-portal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "amneziawg.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "amneziawg.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-state
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "amneziawg.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-nexus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "amneziawg.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.nexus.certificate.secretName }}
  dnsNames:
    - {{ .Values.nexus.host | quote }}
  issuerRef:
    name: {{ .Values.nexus.certificate.issuerName }}
    kind: {{ .Values.nexus.certificate.issuerKind }}
