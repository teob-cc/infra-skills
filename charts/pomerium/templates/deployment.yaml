apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pomerium.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pomerium.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pomerium.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pomerium.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: pomerium
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
          - --config=/etc/pomerium/config.yaml
        volumeMounts:
        - name: config
          mountPath: /etc/pomerium
          readOnly: true
        ports:
        - containerPort: 80
          name: http
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
      volumes:
      - name: config
        secret:
          secretName: {{ .Values.configSecret.name }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
