config:
  routes:
    - from: https://grafana.fake.example.test
      prefix: /mcp
      to: http://mcp-grafana.observability.svc.cluster.local:8000
      preserve_host_header: true
      policy:
        - allow:
            or:
              - claim/groups: fake-org:admins
    - from: https://grafana.fake.example.test
      to: http://grafana.observability.svc.cluster.local:80
      preserve_host_header: true
      pass_identity_headers: true
      allow_any_authenticated_user: true
    # a stale duplicate catch-all (never matched: Pomerium takes the first)
    - from: https://grafana.fake.example.test
      to: http://old-grafana.observability.svc.cluster.local:3000
      allow_any_authenticated_user: true
